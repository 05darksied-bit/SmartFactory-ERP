services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_change_me
      MYSQL_DATABASE: smartfactory_erp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root_change_me
      DB_NAME: smartfactory_erp
      JWT_SECRET: replace_with_a_long_random_secret
      FACTORY_NAME: SmartFactory Foods
      FACTORY_GSTIN: 33AAAAA0000A1Z5
      FACTORY_STATE_CODE: 33
      FACTORY_ADDRESS: Tamil Nadu, India
    ports:
      - "3000:3000"
volumes:
  mysql_data:
