# Nginx config for SmartFactory ERP on Oracle Cloud (HTTP via public IP)
# Step 1: IP-only HTTP – no SSL yet. Use this until Let's Encrypt is configured.

server {
    listen 80;
    listen [::]:80;
    server_name _;                # accept requests to any IP/hostname

    # Let's Encrypt ACME challenge (needed later for certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 5m;

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
