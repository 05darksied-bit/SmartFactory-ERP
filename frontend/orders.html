<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Orders | SmartFactory ERP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"></aside>
<main class="main-content">
<header class="topbar">
  <div><div class="eyebrow">SALES MANAGEMENT</div><h1 class="h3 mb-0">Sales orders</h1></div>
  <span class="status-pill">Order-to-Dispatch Workflow</span>
</header>
<div class="p-4">
  <div class="panel-card p-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div class="d-flex gap-2 flex-wrap" id="filterBtns">
        <button class="btn btn-sm btn-primary filter-btn" data-status="ALL">All</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="SUBMITTED">Submitted</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="APPROVED">Approved</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="INVOICED">Invoiced</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="DISPATCHED">Dispatched</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn" data-status="REJECTED">Rejected</button>
      </div>
      <div class="d-flex gap-2">
        <input type="search" id="orderSearch" class="form-control form-control-sm" placeholder="Search customer or #order" style="width:210px">
        <button class="btn btn-sm btn-outline-primary" id="refreshOrders">↻ Refresh</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle table-hover">
        <thead><tr><th>Order</th><th>Customer</th><th>Salesman</th><th>Status</th><th>Total</th><th>Actions</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="6" class="text-secondary">Loading orders…</td></tr></tbody>
      </table>
    </div>
    <div id="ordersMessage" class="small mt-2"></div>
  </div>
</div>
</main>
</div>

<!-- Order Details & History Modal -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="detailTitle">Order Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detailBody">Loading…</div>
  </div></div>
</div>

<!-- Edit Order Modal -->
<div class="modal fade" id="editOrderModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Edit Order #<span id="editOrderId"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="editOrderForm">
      <div class="modal-body" id="editOrderLines"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div></div>
</div>

<!-- Partial Dispatch Modal -->
<div class="modal fade" id="dispatchModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Dispatch Order #<span id="dispatchOrderId"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="dispatchForm">
      <div class="modal-body">
        <div class="row g-2 mb-3">
          <div class="col-6"><label class="form-label small">Dispatch date</label><input type="date" id="dispatchDate" class="form-control form-control-sm" required></div>
          <div class="col-6"><label class="form-label small">Reference / LR no.</label><input type="text" id="dispatchRef" class="form-control form-control-sm" placeholder="Optional"></div>
        </div>
        <div id="dispatchLines"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success">Post Dispatch</button>
      </div>
    </form>
  </div></div>
</div>

<!-- Reject Order Modal -->
<div class="modal fade" id="rejectModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Reject Order #<span id="rejectOrderId"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="rejectForm">
      <div class="modal-body">
        <label class="form-label">Rejection reason</label>
        <textarea id="rejectReason" class="form-control" rows="3" placeholder="Enter reason for rejection"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Confirm Rejection</button>
      </div>
    </form>
  </div></div>
</div>

<!-- e-Invoice / e-Way Bill Modal -->
<div class="modal fade" id="einvoiceModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">e-Invoice &amp; e-Way Bill (NIC Mock)</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="einvoiceBody">Loading…</div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
