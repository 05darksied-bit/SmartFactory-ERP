<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suppliers | SmartFactory ERP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"></aside>
<main class="main-content">
<header class="topbar">
  <div><div class="eyebrow">PROCUREMENT</div><h1 class="h3 mb-0">Supplier management</h1></div>
  <button class="btn btn-primary btn-sm" id="addSupplierBtn">+ Add Supplier</button>
</header>
<div class="p-4">
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="panel-card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Suppliers</h2>
          <input type="search" id="supSearch" class="form-control form-control-sm" placeholder="Search supplier…" style="width:200px">
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle">
            <thead><tr><th>#</th><th>Name</th><th>GSTIN</th><th>State</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="suppliersBody"><tr><td colspan="6" class="text-secondary">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="panel-card p-3">
        <h2 class="h5 mb-3" id="historyTitle">Supplier purchase history</h2>
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead><tr><th>Date</th><th>Invoice</th><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
            <tbody id="supHistoryBody"><tr><td colspan="5" class="text-secondary small">Click "History" on a supplier to view purchases.</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</main>
</div>

<!-- Add / Edit Supplier Modal -->
<div class="modal fade" id="supplierModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="supModalTitle">Add Supplier</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="supplierForm">
      <div class="modal-body">
        <input type="hidden" id="supId">
        <div class="mb-2"><label class="form-label small">Supplier name *</label><input id="supName" class="form-control" required></div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label small">GSTIN</label><input id="supGstin" class="form-control" maxlength="15"></div>
          <div class="col-6"><label class="form-label small">State code</label><input id="supStateCode" class="form-control" maxlength="2" placeholder="33"></div>
        </div>
        <div class="mb-2"><label class="form-label small">Phone</label><input id="supPhone" class="form-control" type="tel"></div>
        <div class="mb-2"><label class="form-label small">Address</label><textarea id="supAddress" class="form-control" rows="2"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Supplier</button>
      </div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/suppliers.js"></script>
</body>
</html>
