<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quality Control | SmartFactory ERP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"></aside>
<main class="main-content">
<header class="topbar">
  <div><div class="eyebrow">QUALITY ASSURANCE</div><h1 class="h3 mb-0">Quality control &amp; inspections</h1></div>
  <span class="status-pill">Food Safety &amp; Defect Tracking</span>
</header>
<div class="p-4">
  <div class="panel-card p-4 mb-4">
    <h2 class="h5 mb-3">Record production quality inspection</h2>
    <form id="qcForm" class="row g-3">
      <div class="col-md-4"><label class="form-label">Production run</label><select id="qcRunId" class="form-select" required></select></div>
      <div class="col-md-3"><label class="form-label">Inspection date</label><input id="qcDate" type="date" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Status</label><select id="qcStatus" class="form-select"><option value="PASSED">PASSED</option><option value="CONDITIONAL">CONDITIONAL</option><option value="FAILED">FAILED</option></select></div>
      <div class="col-md-3"><label class="form-label">Rejected qty (packets)</label><input id="qcRejected" type="number" min="0" step="1" value="0" class="form-control"></div>

      <div class="col-12">
        <label class="form-label d-block">Quality checklist</label>
        <div class="d-flex flex-wrap gap-3 small">
          <label class="form-check-label"><input type="checkbox" class="form-check-input qc-check" value="seal_integrity" checked> Pouch seal integrity</label>
          <label class="form-check-label"><input type="checkbox" class="form-check-input qc-check" value="weight_accuracy" checked> Net weight (200g ± 2g)</label>
          <label class="form-check-label"><input type="checkbox" class="form-check-input qc-check" value="texture_crispness" checked> Texture &amp; crispness</label>
          <label class="form-check-label"><input type="checkbox" class="form-check-input qc-check" value="batch_print" checked> Batch &amp; expiry print legible</label>
        </div>
      </div>

      <div class="col-md-4"><label class="form-label">Defect type (if any)</label><input id="qcDefect" class="form-control" placeholder="e.g. Broken pieces / Seal leak"></div>
      <div class="col-md-5"><label class="form-label">Corrective action</label><input id="qcAction" class="form-control" placeholder="e.g. Adjusted sealer temperature"></div>
      <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Save Inspection</button></div>
    </form>
  </div>

  <div class="panel-card p-3">
    <h2 class="h5 mb-3">Inspection &amp; corrective action history</h2>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle">
        <thead><tr><th>#</th><th>Date</th><th>Batch / Product</th><th>Status</th><th>Rejected</th><th>Defect</th><th>Corrective Action</th><th>Inspector</th></tr></thead>
        <tbody id="qcBody"><tr><td colspan="8" class="text-secondary">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/qc.js"></script>
</body>
</html>
