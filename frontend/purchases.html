<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchases | SmartFactory ERP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"></aside>
<main class="main-content">
<header class="topbar">
  <div><div class="eyebrow">PROCUREMENT</div><h1 class="h3 mb-0">Purchases &amp; returns</h1></div>
  <a href="/suppliers.html" class="btn btn-sm btn-outline-primary">Manage Suppliers →</a>
</header>
<div class="p-4">
  <div class="panel-card p-4 mb-4">
    <h2 class="h5 mb-3">Record purchase receipt</h2>
    <form id="purchaseForm" class="row g-3">
      <div class="col-md-4"><label class="form-label">Supplier</label><select id="supplierId" class="form-select" required></select></div>
      <div class="col-md-4"><label class="form-label">Supplier invoice no.</label><input id="invoiceNumber" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Purchase date</label><input id="purchaseDate" type="date" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Inventory item</label><select id="itemId" class="form-select" required></select></div>
      <div class="col-md-2"><label class="form-label">Quantity</label><input id="purchaseQty" class="form-control" type="number" min="0.001" step="0.001" required></div>
      <div class="col-md-2"><label class="form-label">Rate (₹)</label><input id="purchaseRate" class="form-control" type="number" min="0" step="0.01" required></div>
      <div class="col-md-2"><label class="form-label">Unit</label><input id="purchaseUnit" class="form-control" readonly></div>
      <div class="col-md-2"><label class="form-label">Batch no.</label><input id="batchNo" class="form-control" placeholder="Optional"></div>
      <div class="col-md-3"><label class="form-label">Expiry date (FEFO)</label><input id="expiryDate" type="date" class="form-control"></div>
      <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Post purchase</button></div>
    </form>
    <div id="purchaseMessage" class="small mt-3"></div>
  </div>

  <div class="panel-card p-3">
    <h2 class="h5 mb-3">Recent purchases</h2>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle">
        <thead><tr><th>#</th><th>Date</th><th>Supplier</th><th>Invoice</th><th>Item</th><th>Qty</th><th>Total</th><th>Action</th></tr></thead>
        <tbody id="purchasesBody"><tr><td colspan="8" class="text-secondary">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</main>
</div>

<!-- Purchase Return Modal -->
<div class="modal fade" id="returnModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Purchase Return — #<span id="retPurId"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="returnForm">
      <div class="modal-body">
        <input type="hidden" id="retItemId">
        <div class="mb-2 small">Returning item: <strong id="retItemName"></strong></div>
        <div class="mb-2"><label class="form-label small">Return quantity</label><input type="number" step="0.001" min="0.001" id="retQty" class="form-control" required></div>
        <div class="mb-2"><label class="form-label small">Reason</label><input type="text" id="retReason" class="form-control" placeholder="Damaged / expired / excess" required></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Post Return</button>
      </div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/purchases.js"></script>
</body>
</html>
